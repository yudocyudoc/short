name: EPI-01 Cloudflare pilot (manual authorization only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'No-inference preflight or the nine-call pilot'
        required: true
        type: choice
        options:
          - auth_check
          - infer
      authorization:
        description: 'Required only for inference'
        required: true
        type: choice
        options:
          - NO_INFERENCE
          - RUN_EPI01_MAX9

permissions:
  contents: read

concurrency:
  group: epi-01-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorized-pilot:
    if: github.ref == 'refs/heads/experiment/epi-01-epistemic-llm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate mode and authorization pairing
        env:
          MODE: ${{ inputs.mode }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          if [[ "$MODE" == "infer" && "$AUTHORIZATION" != "RUN_EPI01_MAX9" ]]; then
            echo "Inference requires explicit authorization."
            exit 1
          fi
          if [[ "$MODE" == "auth_check" && "$AUTHORIZATION" != "NO_INFERENCE" ]]; then
            echo "Use NO_INFERENCE for preflight."
            exit 1
          fi
      - name: No-inference Workers AI preflight
        if: inputs.mode == 'auth_check'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/epistemic-llm-cf-v1/scripts/check_cloudflare_preflight.py
      - name: Generate the fixed paired contexts
        if: inputs.mode == 'infer'
        run: python experiments/epistemic-llm-cf-v1/build_contexts.py --out experiments/epistemic-llm-cf-v1/results
      - name: Execute at most nine authorized calls (no retries)
        if: inputs.mode == 'infer'
        env:
          EPI01_AUTHORIZATION: ${{ inputs.authorization }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/epistemic-llm-cf-v1/scripts/run_cloudflare.py
      - name: Preserve pilot records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epi-01-${{ inputs.mode }}-${{ github.run_id }}
          path: experiments/epistemic-llm-cf-v1/results/
          if-no-files-found: warn
          retention-days: 90

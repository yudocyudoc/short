name: IGC0 M01 audited Worker inference (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_inference:
        description: 'I authorize up to two billed DeepSeek calls for synthetic M01'
        type: choice
        required: true
        options:
          - DO_NOT_RUN
          - RUN_M01_ONE_REVIEW
        default: DO_NOT_RUN

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: igc0-review-results
  cancel-in-progress: false

jobs:
  infer:
    if: ${{ inputs.confirm_inference == 'RUN_M01_ONE_REVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify correct development branch
        run: |
          test "$GITHUB_REF_NAME" = "experiment/c0-cafeteria" || {
            echo "Select experiment/c0-cafeteria as the workflow branch to preserve experimental isolation."; exit 1;
          }
      - name: Verify public evidence and preregistered Python validators
        run: |
          python -m unittest discover -s experiments/igc0/analyst/tests -p 'test_*.py' -v
          python experiments/igc0/analyst/src/prepare.py \
            --public-zip experiments/igc0/analyst/inputs/IGC0_8_mundos_analista.zip \
            --out experiments/igc0/analyst/output
      - name: Check Worker URL and protected endpoint credential
        env:
          IGC_WORKER_URL: ${{ vars.IGC_WORKER_URL }}
          IGC_WORKER_API_KEY: ${{ secrets.IGC_WORKER_API_KEY }}
        run: |
          case "$IGC_WORKER_URL" in https://*) ;; *) echo "Set IGC_WORKER_URL repository variable with HTTPS Worker URL"; exit 1;; esac
          test ${#IGC_WORKER_API_KEY} -ge 24 || { echo "Missing IGC_WORKER_API_KEY secret"; exit 1; }
      - name: Run M01 with one possible feedback revision
        env:
          IGC_WORKER_URL: ${{ vars.IGC_WORKER_URL }}
          IGC_WORKER_API_KEY: ${{ secrets.IGC_WORKER_API_KEY }}
        run: |
          python experiments/igc0/analyst/src/cloudflare_bridge.py \
            --inputs experiments/igc0/analyst/output/inputs \
            --prompt experiments/igc0/analyst/prompts/ig_graph_v3.md \
            --out "experiments/igc0/results/M01/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --execute
      - name: Preserve artifacts regardless of model result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc0-worker-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/igc0/results/M01/run-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit immutable audit trace to results-only branch
        run: |
          set -eu
          RESULT="experiments/igc0/results/M01/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f "$RESULT/summary.json"
          BRANCH="igc0/audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "$RESULT"
          git commit -m "results(igc0): archive M01 Worker inference and deterministic review"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "RESULT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Propose results-only audit pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "experiment/c0-cafeteria" \
            --head "$RESULT_BRANCH" \
            --title "audit(igc0): M01 Worker run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --body "Synthetic M01 only; exact prompts, model responses, hashes and deterministic validations. Do not merge without independent review. No evaluator oracle included." \
          || echo "GitHub Actions may not be permitted to open PRs. The result branch and artifact are still available."

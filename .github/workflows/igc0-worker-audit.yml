name: IGC0 M01-R2 Llama single IG inference (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_inference:
        description: 'I authorize exactly ONE billed Llama IG call for synthetic M01'
        type: choice
        required: true
        options:
          - DO_NOT_RUN
          - RUN_M01_R2_IG_ONCE
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: igc0-review-results
  cancel-in-progress: false

jobs:
  infer:
    if: ${{ inputs.confirm_inference == 'RUN_M01_R2_IG_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify correct development branch
        run: |
          test "$GITHUB_REF_NAME" = "experiment/igc0-m01-r2-llama" || {
            echo "Select experiment/igc0-m01-r2-llama as the workflow branch to preserve experimental isolation."; exit 1;
          }
      - name: Verify public evidence, Worker, and preregistered Python validators
        run: |
          node --check experiments/igc0/worker/src/index.mjs
          node --test experiments/igc0/worker/tests/*.test.mjs
          python -m unittest discover -s experiments/igc0/analyst/tests -p 'test_*.py' -v
          python experiments/igc0/analyst/src/prepare.py \
            --public-zip experiments/igc0/analyst/inputs/IGC0_8_mundos_analista.zip \
            --out experiments/igc0/analyst/output
      - name: Check Worker URL and protected endpoint credential
        env:
          IGC_WORKER_URL: ${{ vars.IGC_WORKER_URL }}
          IGC_WORKER_API_KEY: ${{ secrets.IGC_WORKER_API_KEY }}
        run: |
          case "$IGC_WORKER_URL" in https://*) ;; *) echo "Set IGC_WORKER_URL repository variable with HTTPS Worker URL"; exit 1;; esac
          test ${#IGC_WORKER_API_KEY} -ge 24 || { echo "Missing IGC_WORKER_API_KEY secret"; exit 1; }
      - name: Run M01-R2 IG (exactly one inference, zero retries)
        env:
          IGC_WORKER_URL: ${{ vars.IGC_WORKER_URL }}
          IGC_WORKER_API_KEY: ${{ secrets.IGC_WORKER_API_KEY }}
        run: |
          python experiments/igc0/analyst/src/cloudflare_bridge.py \
            --inputs experiments/igc0/analyst/output/inputs \
            --prompt experiments/igc0/analyst/prompts/ig_graph_v3.md \
            --out "experiments/igc0/results/M01/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --execute
      - name: Preserve artifacts regardless of model result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc0-worker-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/igc0/results/M01/run-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
      # No automatic push: raw output + hashes persist as a GitHub Actions artifact.
      # Review before importing into a results-only branch.

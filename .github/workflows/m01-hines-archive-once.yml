name: M01 — archive existing Hines composition (one-shot)

on:
  pull_request:
    types: [synchronize]
    branches: [experiment/hines-pysd-parity]
    paths:
      - 'experiments/hines-pysd/authorizations/M01-ARCHIVE-ONCE.md'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/m01-hines-composition' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/hines-pysd-parity
      - name: Fetch prior completed structural result (no recomputation)
        uses: actions/download-artifact@v4
        with:
          name: m01-hines-structural-composition
          run-id: 38824913038
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/m01-hines-source
      - name: Independently verify report, provenance and produce file digest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          src=Path('/tmp/m01-hines-source/m01_hines_composition.json')
          r=json.loads(src.read_text())
          assert r['experiment']=='M01_HINES_STRUCTURAL_COMPOSITION_V1'
          assert r['public_input_sha256']=='3ede7ef04e172c04f9ab5564c57bc1b1e5d88ba63c19b76660e9941f13dec6df'
          assert r['structure_gate']['status']=='PASS'
          assert r['simulation_gate']['status']=='BLOCKED_NOT_IDENTIFIED'
          assert r['llm_calls']==0 and r['pysd_cafeteria_runs']==0
          assert r['cohort_screen']['windows']==42
          assert len(r['cohort_rows'])==42
          assert set(r['hines_sha256'])=={'delay.mdl','CapUtil.mdl','invbakf.mdl','invbakl.mdl'}
          dst=Path('experiments/hines-pysd/results/m01-composition-run-38824913038-1')
          assert not dst.exists()
          dst.mkdir(parents=True)
          shutil.copyfile(src,dst/src.name)
          m={
            'source_workflow_run':38824913038,
            'source_artifact_id':12014183084,
            'source_artifact_zip_sha256':'39dc62ff8cde03362861786948d4c2f0b780201dc7b275aace4eaeb2cd2ad82d',
            'source_head_sha':'45a9c2a1aab7e805c9c95be28fbd3f344f6dcb47',
            'inferences':0,'pysd_cafeteria_runs':0,
            'files':{src.name:hashlib.sha256(src.read_bytes()).hexdigest()}
          }
          (dst/'archive_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print('VERIFIED_M01_STRUCTURAL_ARCHIVE')
          PY
      - name: Commit immutable results to dedicated results branch
        run: |
          set -eu
          BRANCH=igc0/audit-m01-hines-38824913038-1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- experiments/hines-pysd/results/m01-composition-run-38824913038-1
          git diff --cached --name-only | grep -v '^experiments/hines-pysd/results/m01-composition-run-38824913038-1/' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git commit -m "audit(m01): archive exact Hines structural composition result"
          git push origin "HEAD:refs/heads/$BRANCH"

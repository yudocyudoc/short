name: C2 Cloudflare Workers AI SD rules

on:
  push:
    branches:
      - experiment/c0-cafeteria
    paths:
      - experiments/c2/FIRST_RUN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner syntax
        run: python3 -m py_compile scripts/run_c2_cloudflare.py
      - name: C2 one A/B pair (same model)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C2_CF_MODEL: '@cf/zai-org/glm-4.7-flash'
          C2_RUN_ORDER: A,B
          C2_MAX_COMPLETION_TOKENS: '2400'
        run: python3 scripts/run_c2_cloudflare.py
      - name: Preserve raw outputs and usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-cloudflare-results
          path: c2-cloudflare-results/
          if-no-files-found: warn

name: C1 Cloudflare Workers AI A-B

on:
  push:
    branches:
      - experiment/c0-cafeteria
    paths:
      - experiments/c1/TRIGGER_FIRST_RUN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute C1 A/B through Workers AI (two calls maximum)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C1_CF_MODEL: '@cf/zai-org/glm-4.7-flash'
          C1_RUN_ORDER: A,B
          C1_MAX_COMPLETION_TOKENS: '2400'
        run: python3 scripts/run_c1_cloudflare.py
      - name: Preserve complete raw responses and usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-cloudflare-results
          path: c1-cloudflare-results/
          if-no-files-found: warn

name: IGC field mechanism selection v1

on:
  pull_request:
    branches: [experiment/igc-openmodelica-mto-s2]
    paths:
      - 'experiments/field-selection-v1/**'
      - '.github/workflows/igc-field-selection-v1.yml'
  workflow_dispatch:
    inputs:
      confirm_real_llm:
        description: 'Eight actual Llama calls with configured Cloudflare secrets (never on PR CI)'
        type: choice
        required: true
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_EIGHT_CASES

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all frozen cases, independent evidence gates, and prompt isolation (no LLM)
        run: |
          python -m unittest discover -s experiments/field-selection-v1 -p 'test_*.py' -v
          python experiments/field-selection-v1/run_llm.py \
            --prepare-only --out experiments/field-selection-v1/output/prepared
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/field-selection-v1/output/prepared/manifest.json")
          a=json.loads(p.read_text())
          assert a["real_model_inference"] is False
          assert all(x["status"]=="PREPARED_ONLY" for x in a["cases"])
          assert len(a["cases"])==8
          print("EIGHT_PROMPTS_PREPARED_NOT_LLM_TESTED")
          PY
      - name: Preserve prepared prompts, never report them as an LLM result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc-field-selection-prepared-${{ github.run_id }}
          path: experiments/field-selection-v1/output/prepared/
          if-no-files-found: warn
          retention-days: 90

  actual-llm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_real_llm == 'RUN_EIGHT_CASES' }}
    needs: [deterministic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real one-shot independent selection with Llama (max eight calls; no retry)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python experiments/field-selection-v1/run_llm.py \
            --execute --out experiments/field-selection-v1/output/actual-llm
      - name: Preserve actual prompts, raw model responses, compilation and score even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc-field-selection-actual-${{ github.run_id }}
          path: experiments/field-selection-v1/output/actual-llm/
          if-no-files-found: warn
          retention-days: 90

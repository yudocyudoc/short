name: C0 Cloudflare Workers AI A-B

on:
  push:
    branches:
      - experiment/c0-cafeteria
    paths:
      - experiments/c0/START_CLOUDFLARE_ONCE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute A/B via Workers AI (max two calls)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C0_CF_MODEL: '@cf/zai-org/glm-4.7-flash'
          C0_RUN_ORDER: A,B
          C0_MAX_COMPLETION_TOKENS: '2400'
        run: python3 scripts/run_c0_cloudflare.py
      - name: Preserve raw responses and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-cloudflare-results
          path: c0-cloudflare-results/
          if-no-files-found: warn

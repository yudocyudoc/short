name: C0 SD-AI A-B smoke and runs

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  c0-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run isolated A/B inference
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C0_MODEL: auto
          C0_RUN_ORDER: A,B
          C0_MAX_AI_CREDITS: '30'
        run: python3 scripts/run_c0_ab.py
      - name: Preserve raw outputs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-ab-raw-results
          path: c0-run-output/
          if-no-files-found: warn

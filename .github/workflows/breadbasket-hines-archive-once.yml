name: Bread Basket SD — preserve verified run once

on:
  pull_request:
    types: [synchronize]
    branches: [experiment/breadbasket-real-observations]
    paths:
      - 'experiments/real-pos/bread-basket/sd-scenarios/authorizations/ARCHIVE-ONCE.md'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/breadbasket-hines-scenarios' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/breadbasket-real-observations
      - name: Download prior immutable PySD results without re-running models
        uses: actions/download-artifact@v4
        with:
          name: breadbasket-hines-scenarios
          run-id: 38843656367
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/breadbasket-hines-scenarios
      - name: Verify exact outputs, warnings and create audit manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,csv
          src=Path('/tmp/breadbasket-hines-scenarios')
          report=json.loads((src/'conditional_scenario_summary.json').read_text())
          sources=json.loads((src/'source_manifest.json').read_text())
          assert report['experiment']=='BREADBASKET_HINES_PYSD_CONDITIONAL_V1'
          assert report['engine_version']=='3.14.3'
          assert report['verdict']=='SCENARIO_SIMULATION_NOT_EMPIRICAL_VALIDATION'
          assert report['observed_source_git_blob_sha1']=='ceea9513b75a3dda41a9209b6fd1875c12580933'
          assert len(report['days'])==2 and [x['source_sale_transactions'] for x in report['days']]==[139,79]
          assert all(len(x['scenarios'])==3 for x in report['days'])
          assert report['operational_plausibility_gate']['status']=='WARNING_MAKE_TO_ORDER_OVERPRODUCTION'
          assert len(report['operational_plausibility_gate']['alerts'])==2
          assert report['safety_conclusions']['llm_calls']==0
          assert all(s['conservation_order_abs_error']<1e-6 and s['conservation_prepared_inventory_abs_error']<1e-6
                     for day in report['days'] for s in day['scenarios'])
          assert all(sources['files'][n]['status']=='VERIFIED' for n in
                     ('CapUtil.mdl','invbakf.mdl','delay.mdl','invbakl.mdl'))
          assert not list(src.rglob('*.mdl'))
          with (src/'conditional_timeseries.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==2*3*97
          dest=Path('experiments/real-pos/bread-basket/sd-scenarios/results/run-38843656367-1')
          assert not dest.exists()
          shutil.copytree(src,dest)
          manifest={
           'source_run':'https://github.com/yudocyudoc/short/actions/runs/38843656367',
           'source_artifact_id':12022676608,
           'source_artifact_zip_sha256':'4c646a55e6775a52a36056db676251b94e881d47ee197e3402acd35e28b971ab',
           'source_code_commit':'c8f40e5691f7028ba48294bd4c1c4884be675795',
           'summary_status':'SCENARIO_SIMULATION_NOT_EMPIRICAL_VALIDATION',
           'business_plausibility_warning':True,
           'original_mdl_bytes_in_archive':False,
           'original_pos_bytes_in_archive':False,
           'llm_calls':0,
           'files':{p.relative_to(dest).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(dest.rglob('*')) if p.is_file()}
          }
          (dest/'archive_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('BREADBASKET_HINES_RESULTS_ARCHIVED_FILES',len(manifest['files']))
          PY
      - name: Create independent audit branch and commit derived results
        run: |
          set -eu
          BRANCH=igc0/audit-breadbasket-hines-38843656367-1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- experiments/real-pos/bread-basket/sd-scenarios/results/run-38843656367-1
          git diff --cached --name-only | grep -v '^experiments/real-pos/bread-basket/sd-scenarios/results/run-38843656367-1/' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git commit -m 'audit(breadbasket): preserve conditional Hines/PySD run and plausibility warnings'
          git push origin "HEAD:refs/heads/$BRANCH"

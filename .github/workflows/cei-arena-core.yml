name: CEI Arena core contracts
on:
  push:
    paths:
      - 'arena/**'
      - '.github/workflows/cei-arena-core.yml'
  pull_request:
    paths:
      - 'arena/**'
      - '.github/workflows/cei-arena-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s arena/tests -v
      - run: python -m arena.cli prepare arena/examples/cafeteria.json C_IGC output/visible.json
      - uses: actions/upload-artifact@v4
        with:
          name: cei-arena-visible-example
          path: output/visible.json
          retention-days: 7

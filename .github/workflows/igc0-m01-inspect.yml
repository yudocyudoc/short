name: IGC0 inspect saved M01 model (zero inference)

on:
  push:
    branches:
      - experiment/c0-cafeteria
    paths:
      - experiments/igc0/analyst/runs/M01_INSPECT.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download original M01 model (no Workers AI access)
        run: gh run download 38682204680 --repo yudocyudoc/short --name igc0-m01-deepseek-first --dir original
      - name: Diagnostic of typed graph and missing IGC stages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('original')
          model=json.loads((root/'llm/M01/proposed_model.json').read_text(encoding='utf-8'))
          check=json.loads((root/'llm/M01/validation.json').read_text())
          packet=json.loads((root/'inputs/M01.json').read_text())
          details={
            'case_id':model.get('case_id'),
            'validator_accepted':check.get('accepted'),
            'stocks':[
              {'id':s.get('id'),'unit':s.get('unit'),'initial':s.get('initial'),
               'label':s.get('initial_label'),'refs':len(s.get('initial_refs',[]))}
              for s in model.get('stocks',[]) if isinstance(s,dict)],
            'pipes':[
              {'id':p.get('id'),'from':p.get('from'),'to':p.get('to'),
               'unit':p.get('unit_per_time'),'epistemic':p.get('epistemic'),
               'evidence_refs':len(p.get('evidence_refs',[]))}
              for p in model.get('pipes',[]) if isinstance(p,dict)],
            'boundary':model.get('boundary'),
            'contrast_count':len(model.get('contrast',[])),
            'contrast':model.get('contrast',[]),
            'identifiability':model.get('identifiability'),
            'actions':model.get('actions'),
            'decision':model.get('decision'),
            'unknowns':model.get('unknowns'),
            'scenario_projection_count':len(model.get('scenario_projections',[])),
            'public_observations':{
              'pos_rows':len(packet.get('pos_by_arrival_cohort',[])),
              'daily_snapshots':len(packet.get('daily_stocks',[]))},
            'posthoc_igc_complete':bool(model.get('stocks') and model.get('pipes')
                                        and model.get('contrast')
                                        and model.get('identifiability')),
          }
          out=Path('m01-posthoc-diagnostic.json')
          out.write_text(json.dumps(details,ensure_ascii=False,indent=2)+'\n')
          print('IGC0_M01_DIAGNOSTIC',json.dumps(details,ensure_ascii=False))
          PY
      - name: Apply independent semantic audit to the frozen first model
        run: python experiments/igc0/analyst/src/semantic_audit.py --model original/llm/M01/proposed_model.json --packet original/inputs/M01.json --out m01-posthoc-semantic-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: igc0-m01-diagnostic-no-inference
          path: |
            m01-posthoc-diagnostic.json
            m01-posthoc-semantic-audit.json
          retention-days: 90

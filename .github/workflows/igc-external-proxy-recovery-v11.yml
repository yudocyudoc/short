name: IGC independent proxy recovery v1.1 (original cases, no GLM thinking)

on:
  pull_request:
    branches: [experiment/igc-evidence-molecules-challenge-v2]
    paths:
      - 'experiments/external-model-blind-v1/recover_reference_v11.py'
      - '.github/workflows/igc-external-proxy-recovery-v11.yml'
  push:
    branches: [experiment/igc-external-model-blind-v1]
    paths:
      - 'experiments/external-model-blind-v1/authorize_one_recovery_v11.txt'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All original frozen source checks and evidence-gates tests
        run: |
          python -m unittest discover -s experiments/external-model-blind-v1 -p 'test_*.py' -v

  recovered-reference:
    needs: [preflight]
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'run(igc): recover GLM proxy reference from frozen Qwen originals'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download untouched original Qwen cases generated in failed first run
        uses: actions/download-artifact@v4
        with:
          name: igc-external-reference-before-llama-38995455018
          repository: yudocyudoc/short
          run-id: 38995455018
          github-token: ${{ github.token }}
          path: experiments/external-model-blind-v1/output/original_source
      - name: Verify pinned source SHA then label with GLM reasoning off
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python experiments/external-model-blind-v1/recover_reference_v11.py \
            --original-input experiments/external-model-blind-v1/output/original_source/generated_cases.json \
            --out experiments/external-model-blind-v1/output
      - name: Freeze GLM adjudication BEFORE any Llama inference, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc-recovered-reference-before-llama-${{ github.run_id }}
          path: experiments/external-model-blind-v1/output/reference/
          if-no-files-found: warn
          retention-days: 90

  tested-llama-frozen:
    needs: [recovered-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load reference already frozen in previous job
        uses: actions/download-artifact@v4
        with:
          name: igc-recovered-reference-before-llama-${{ github.run_id }}
          path: experiments/external-model-blind-v1/output/reference
      - name: Original Llama B/C prompts, original evaluator, original regex and catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python experiments/external-model-blind-v1/run_blind.py --execute-test \
            --out experiments/external-model-blind-v1/output
      - name: Archive all original Llama replies, cited facts and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc-recovered-blind-llama-${{ github.run_id }}
          path: experiments/external-model-blind-v1/output/tested/
          if-no-files-found: warn
          retention-days: 90

name: C4 SD graph build-verify-revise

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile C4 runner and verifier
        run: python3 -m py_compile scripts/c4_validator.py scripts/run_c4_cloudflare.py
      - name: Run C4 validator positive/negative controls
        run: python3 -m unittest discover -s tests -p test_c4_validator.py -v
      - name: Model proposal and at most one error-informed revision
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/run_c4_cloudflare.py
      - name: Preserve original outputs, verdicts and usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-build-verify-revise
          path: c4-cloudflare-results/
          if-no-files-found: warn

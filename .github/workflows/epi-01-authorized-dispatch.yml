name: EPI-01 authorized dispatcher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'No-inference preflight or the nine-call pilot'
        required: true
        type: choice
        options:
          - auth_check
          - infer
      experiment_sha:
        description: 'Only the approved EPI-01 commit e32f726f7ec4886ed0fe172d3b1a8786a965c19d'
        required: true
        type: string
      authorization:
        description: 'Inference requires explicit authorization'
        required: true
        type: choice
        options:
          - NO_INFERENCE
          - RUN_EPI01_MAX9

permissions:
  contents: read

concurrency:
  group: epi-01-authorized-dispatch
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      experiment_sha: ${{ steps.verify.outputs.experiment_sha }}
    steps:
      - name: Checkout dispatcher from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate approved SHA and mode authorization
        id: verify
        env:
          MODE: ${{ inputs.mode }}
          EXPERIMENT_SHA: ${{ inputs.experiment_sha }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          APPROVED_EXPERIMENT_SHA="e32f726f7ec4886ed0fe172d3b1a8786a965c19d"
          if [[ ! "$EXPERIMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide a full lowercase commit SHA."
            exit 1
          fi
          if [[ "$EXPERIMENT_SHA" != "$APPROVED_EXPERIMENT_SHA" ]]; then
            echo "Only the reviewed EPI-01 revision is permitted."
            exit 1
          fi
          if [[ "$MODE" == "infer" && "$AUTHORIZATION" != "RUN_EPI01_MAX9" ]]; then
            echo "Inference requires RUN_EPI01_MAX9."
            exit 1
          fi
          if [[ "$MODE" == "auth_check" && "$AUTHORIZATION" != "NO_INFERENCE" ]]; then
            echo "Use NO_INFERENCE for preflight."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/experiment/epi-01-epistemic-llm:refs/remotes/origin/experiment/epi-01-epistemic-llm
          git cat-file -e "$EXPERIMENT_SHA^{commit}"
          if ! git merge-base --is-ancestor "$EXPERIMENT_SHA" refs/remotes/origin/experiment/epi-01-epistemic-llm; then
            echo "Approved SHA is no longer in the EPI-01 experiment branch history."
            exit 1
          fi
          echo "experiment_sha=$EXPERIMENT_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE; approved EPI-01 revision validated; no provider call made."

  run:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the explicitly approved experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.experiment_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare paired contexts (no inference)
        run: python experiments/epistemic-llm-cf-v1/build_contexts.py --out experiments/epistemic-llm-cf-v1/results
      - name: No-inference Workers AI preflight
        if: inputs.mode == 'auth_check'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/epistemic-llm-cf-v1/scripts/check_cloudflare_preflight.py
      - name: Execute at most nine authorized calls (no retries)
        if: inputs.mode == 'infer'
        env:
          EPI01_AUTHORIZATION: ${{ inputs.authorization }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/epistemic-llm-cf-v1/scripts/run_cloudflare.py
      - name: Preserve EPI-01 records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epi-01-${{ inputs.mode }}-${{ github.run_id }}
          path: experiments/epistemic-llm-cf-v1/results/
          if-no-files-found: warn
          retention-days: 90

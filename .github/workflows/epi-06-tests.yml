name: EPI-06 four-arm atomic questions diagnostic (offline)

on:
  push:
    branches: [experiment/epi-06-atomic-questions]
    paths:
      - 'experiments/clef-atomic-factorial-v1/**'
      - '.github/workflows/epi-06-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/clef-atomic-factorial-v1/**'
      - '.github/workflows/epi-06-tests.yml'

permissions:
  contents: read

jobs:
  offline-factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent gold validation and fully mocked 80-request cycle
        run: python -m unittest discover -s experiments/clef-atomic-factorial-v1 -p 'test_*.py' -v
      - name: Prepare and fingerprint 80 immutable requests without inference
        run: python experiments/clef-atomic-factorial-v1/prepare.py --out "$RUNNER_TEMP/epi06"
      - name: Archive preparation manifest - NO INFERENCE
        uses: actions/upload-artifact@v4
        with:
          name: epi06-prepared-without-provider
          path: ${{ runner.temp }}/epi06/
          retention-days: 30
          if-no-files-found: error

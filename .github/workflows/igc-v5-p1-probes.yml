name: IGC v5.1 P1 — reproduce current linter limits
on:
  push:
    branches: [experiment/igc-v5-p1-limit-probes-v1]
    paths:
      - 'experiments/p1/probe_limits.py'
      - 'experiments/e1/**'
      - '.github/workflows/igc-v5-p1-probes.yml'
  pull_request:
    branches: [experiment/igc-v3-e1-registry-composer-v1]
    paths:
      - 'experiments/p1/probe_limits.py'
      - 'experiments/e1/**'
      - '.github/workflows/igc-v5-p1-probes.yml'
permissions:
  contents: read
jobs:
  p1-limit-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original E1 regression tests
        run: python -m unittest discover -s experiments/e1 -p 'test_*.py' -v
      - name: Exhibit P1 limits under the unmodified E1 linter
        run: python experiments/p1/probe_limits.py
      - name: Archive precise outcome, including rejected legitimate graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igc-v5-p1-limit-measurements
          path: experiments/p1/output/results.json
          retention-days: 90
          if-no-files-found: warn

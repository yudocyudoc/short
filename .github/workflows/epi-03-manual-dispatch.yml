name: EPI-03 manual Cloudflare decision models

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Credential/model catalog preflight OR bounded inference'
        required: true
        type: choice
        options: [auth_check, infer]
      experiment_sha:
        description: 'Pinned EPI-03 experiment SHA after review'
        required: true
        type: string
      authorization:
        description: 'Separate user authorization for inference'
        required: true
        type: choice
        options: [NO_INFERENCE, RUN_EPI03_MAX36]

permissions:
  contents: read

concurrency:
  group: epi03-manual
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned commit and mode
        id: verify
        env:
          MODE: ${{ inputs.mode }}
          AUTHORIZATION: ${{ inputs.authorization }}
          REVISION: ${{ inputs.experiment_sha }}
        run: |
          set -euo pipefail
          APPROVED_SHA="928c213e2879dcf1fcb49df63e0fd645b463b285"
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]] || [[ "$REVISION" != "$APPROVED_SHA" ]]; then
            echo "SHA rejected: only the reviewed EPI-03 commit is allowed"; exit 1
          fi
          if [[ "$MODE" == "auth_check" && "$AUTHORIZATION" != "NO_INFERENCE" ]]; then exit 1; fi
          if [[ "$MODE" == "infer" && "$AUTHORIZATION" != "RUN_EPI03_MAX36" ]]; then exit 1; fi
          if [[ "$MODE" != "auth_check" && "$MODE" != "infer" ]]; then exit 1; fi
          git fetch --no-tags origin refs/heads/experiment/epi-03-clef-clairic:refs/remotes/origin/experiment/epi-03-clef-clairic
          git cat-file -e "$REVISION^{commit}"
          git merge-base --is-ancestor "$REVISION" refs/remotes/origin/experiment/epi-03-clef-clairic
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Pinned revision validated; no model invocation in this job."

  execute:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline design tests only
        run: python -m unittest discover -s experiments/decision-models-cf-v1 -p 'test_*.py' -v
      - name: Prepare frozen requests without calls
        run: python experiments/decision-models-cf-v1/prepare.py --out experiments/decision-models-cf-v1/results
      - name: Check catalog only - ZERO inference
        if: inputs.mode == 'auth_check'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/decision-models-cf-v1/preflight.py
      - name: Execute 36 authorized inferences maximum - no retries
        if: inputs.mode == 'infer'
        env:
          EPI03_AUTHORIZATION: ${{ inputs.authorization }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python experiments/decision-models-cf-v1/run_cloudflare.py --out experiments/decision-models-cf-v1/results
      - name: Evaluate completed or partial manifest
        if: always() && inputs.mode == 'infer'
        shell: bash
        run: |
          if [[ -f experiments/decision-models-cf-v1/results/inference-manifest.json ]]; then
            python experiments/decision-models-cf-v1/evaluate.py --out experiments/decision-models-cf-v1/results
          fi
      - name: Preserve raw evidence and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epi03-${{ inputs.mode }}-${{ github.run_id }}
          path: experiments/decision-models-cf-v1/results/
          if-no-files-found: warn
          retention-days: 90

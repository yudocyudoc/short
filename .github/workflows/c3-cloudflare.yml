name: C3 typed SD graph A-B

on:
  push:
    branches:
      - experiment/c0-cafeteria
    paths:
      - experiments/c3/FIRST_RUN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify validator and inference syntax
        run: python3 -m py_compile scripts/c3_validator.py scripts/run_c3_cloudflare.py
      - name: Verify validator against gold and negative controls
        run: python3 -m unittest tests/test_c3_validator.py -v
      - name: Run one A-B pair, validate separately, preserve failures
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C3_CF_MODEL: '@cf/zai-org/glm-4.7-flash'
          C3_RUN_ORDER: A,B
          C3_MAX_COMPLETION_TOKENS: '2600'
        run: python3 scripts/run_c3_cloudflare.py
      - name: Upload raw outputs, reports and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-typed-graph-results
          path: c3-cloudflare-results/
          if-no-files-found: warn

name: Hines PySD — archive verified run (one shot)

on:
  pull_request:
    types: [synchronize]
    branches: [experiment/c0-cafeteria]
    paths:
      - 'experiments/hines-pysd/authorizations/ARCHIVE-ONCE.md'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ github.event.pull_request.number == 5 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/hines-pysd-parity' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/c0-cafeteria
      - name: Obtain existing run artifact (no model simulation)
        uses: actions/download-artifact@v4
        with:
          name: hines-pysd-parity
          run-id: 38808748143
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hines-pysd-comparison
      - name: Verify and manifest comparison results
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          origin=Path('/tmp/hines-pysd-comparison')
          report=json.loads((origin/'parity_report.json').read_text())
          sources=json.loads((origin/'source_manifest.json').read_text())
          assert report['overall']=='PASS'
          assert report['pysd_version']=='3.14.3'
          assert set(report['models'])=={'delay.mdl','CapUtil.mdl','invbakf.mdl','invbakl.mdl'}
          assert all(item['status']=='PASS' and item['num_errors']==0 for item in report['models'].values())
          assert all(item['status']=='VERIFIED' for item in sources['files'].values())
          assert len(list(origin.glob('*_pysd.csv')))==4
          assert len(list(origin.glob('*_diff.csv')))==4
          assert not list(origin.glob('*.mdl'))
          dest=Path('experiments/hines-pysd/results/run-38808748143-1')
          assert not dest.exists()
          shutil.copytree(origin,dest)
          manifest={
            'source_run':'https://github.com/yudocyudoc/short/actions/runs/38808748143',
            'source_artifact_id':12007940754,
            'source_artifact_zip_sha256':'e8b57813c1f9ad0c68b0f47104484cce236a82eabf49ef3c38f5991b4518655f',
            'experiment_head_commit':'2fd139b5ef9f9235a9d476e913c82ba398bb6322',
            'originals_redistributed':False,
            'files':{p.relative_to(dest).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(dest.rglob('*')) if p.is_file()}
          }
          (dest/'archive_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('AUDIT_FILES',len(manifest['files']),'PYSD_RERUNS',0,'AI_CALLS',0)
          PY
      - name: Commit permanent results-only branch
        run: |
          set -eu
          BRANCH=igc0/audit-hines-pysd-38808748143-1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- experiments/hines-pysd/results/run-38808748143-1
          git diff --cached --name-only | grep -v '^experiments/hines-pysd/results/run-38808748143-1/' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git commit -m "audit(hines): preserve original-model PySD parity result"
          git push origin "HEAD:refs/heads/$BRANCH"
